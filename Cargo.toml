[workspace]
members  = [
    "indra-core",
    "indra-crypto",
    "indra-bulletproofs",
    "indra-state",
    "indra-consensus",
    "indra-storage",
    "indra-node",
    "indra-network",
    "indra-rpc",
    "indra-cli",
    "indra-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["INDRA Protocol"]
license = "MIT"

[workspace.dependencies]
sha2               = { version = "0.10", default-features = false }
thiserror          = { version = "1.0" }
hex                = { version = "0.4", default-features = false, features = ["alloc"] }
ed25519-dalek      = { version = "2.1", default-features = false, features = ["alloc"] }
curve25519-dalek   = { version = "4.1", default-features = false, features = ["alloc"] }
pqcrypto-dilithium = { version = "0.5", default-features = false }
pqcrypto-traits    = { version = "0.3", default-features = false }
blst               = { version = "0.3" }
proptest           = { version = "1.4", default-features = false, features = ["std"] }
indra-bulletproofs = { path = "./indra-bulletproofs" }
subtle             = { version = "2.5", default-features = false }
zeroize            = { version = "1.7", default-features = false, features = ["alloc"] }
rand_core          = { version = "0.6", default-features = false }
rand               = { version = "0.8", default-features = false, features = ["std"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true

[profile.bench]
opt-level = 3
debug     = false
