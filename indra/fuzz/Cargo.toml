[package]
name = "indra-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
hex = "0.4"
indra-core = { path = "../indra-core" }
indra-network = { path = "../indra-network" }
indra-rpc = { path = "../indra-rpc" }
indra-state = { path = "../indra-state" }
indra-crypto = { path = "../indra-crypto" }
curve25519-dalek-v5 = { package = "curve25519-dalek", version = "5.0", default-features = false, features = ["alloc"] }

[[bin]]
name = "transaction_deserialization"
path = "fuzz_targets/transaction_deserialization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "public_json_rpc"
path = "fuzz_targets/public_json_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "governance_parsing"
path = "fuzz_targets/governance_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_gossip_parsing"
path = "fuzz_targets/p2p_gossip_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vrf_verify_arbitrary"
path = "fuzz_targets/vrf_verify_arbitrary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vrf_valid_proof_mutation"
path = "fuzz_targets/vrf_valid_proof_mutation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vrf_public_key_validation"
path = "fuzz_targets/vrf_public_key_validation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vrf_prove_verify_roundtrip"
path = "fuzz_targets/vrf_prove_verify_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vrf_proof_framing"
path = "fuzz_targets/vrf_proof_framing.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
