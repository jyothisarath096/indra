[package]
name        = "indra-cli"
description = "INDRA v2 command-line tools — keygen, genesis, tx submission, queries"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
indra-core      = { path = "../indra-core" }
indra-crypto    = { path = "../indra-crypto" }
indra-state     = { path = "../indra-state" }
indra-node      = { path = "../indra-node" }
indra-rpc       = { path = "../indra-rpc" }
indra-keystore  = { path = "../indra-keystore" }
thiserror.workspace = true
hex.workspace = true
serde_json.workspace = true
serde.workspace = true
rand.workspace = true
libc.workspace = true
zeroize.workspace = true

[dev-dependencies]
indra-core      = { path = "../indra-core", features = ["test-support"] }
indra-crypto    = { path = "../indra-crypto" }
indra-node      = { path = "../indra-node", features = ["test-support"] }
indra-rpc       = { path = "../indra-rpc" }

[[bin]]
name = "indra-send"
path = "src/bin/send.rs"

[[bin]]
name = "indra-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "indra-genesis"
path = "src/bin/genesis.rs"

[[bin]]
name = "indra-wallet-scan"
path = "src/bin/wallet_scan.rs"

[[bin]]
name = "indra-tx"
path = "src/bin/tx.rs"

[[bin]]
name = "indra-stake"
path = "src/bin/stake.rs"

[[bin]]
name = "indra-governance"
path = "src/bin/governance.rs"
