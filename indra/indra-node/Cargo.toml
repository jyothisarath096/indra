[package]
name        = "indra-node"
description = "INDRA v2 node binary — consensus engine, storage, sync, slash detection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
hex.workspace = true
indra-core      = { path = "../indra-core" }
indra-crypto    = { path = "../indra-crypto" }
indra-state     = { path = "../indra-state" }
indra-consensus = { path = "../indra-consensus" }
indra-storage   = { path = "../indra-storage" }
indra-network   = { path = "../indra-network" }
indra-rpc       = { path = "../indra-rpc" }
indra-keystore  = { path = "../indra-keystore" }
indra-bulletproofs = { path = "../indra-bulletproofs" }
rand.workspace = true
thiserror.workspace = true
fs2 = "0.4"
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
toml.workspace = true

[dev-dependencies]
indra-core      = { path = "../indra-core" }
indra-crypto    = { path = "../indra-crypto" }
indra-state     = { path = "../indra-state" }
indra-consensus = { path = "../indra-consensus" }
indra-storage   = { path = "../indra-storage" }
indra-network   = { path = "../indra-network" }

[[bin]]
name = "indra-observer"
path = "src/bin/observer.rs"
