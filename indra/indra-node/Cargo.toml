[package]
name        = "indra-node"
description = "INDRA v2 node binary — consensus engine, storage, sync, slash detection"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
audit-harness = []

[dependencies]
hex.workspace = true
sha2.workspace = true
indra-core      = { path = "../indra-core" }
indra-crypto    = { path = "../indra-crypto" }
indra-state     = { path = "../indra-state" }
indra-consensus = { path = "../indra-consensus" }
indra-storage   = { path = "../indra-storage" }
indra-network   = { path = "../indra-network" }
indra-rpc       = { path = "../indra-rpc" }
indra-keystore  = { path = "../indra-keystore" }
hickory-resolver.workspace = true
rand.workspace = true
thiserror.workspace = true
fs2 = "0.4"
serde_json = "1"
serde.workspace = true
subtle.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
toml.workspace = true

[dev-dependencies]
indra-core      = { path = "../indra-core" }
indra-crypto    = { path = "../indra-crypto" }
indra-state     = { path = "../indra-state" }
indra-consensus = { path = "../indra-consensus", features = ["test-utils"] }
indra-storage   = { path = "../indra-storage" }
indra-network   = { path = "../indra-network" }
tempfile        = "3"
libc            = "0.2"

[[bin]]
name = "indra-observer"
path = "src/bin/observer.rs"
