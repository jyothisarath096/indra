[workspace]
members  = [
    "indra-core",
    "indra-crypto",
    "indra-bulletproofs",
    "indra-state",
    "indra-consensus",
    "indra-storage",
    "indra-node",
    "indra-network",
    "indra-rpc",
    "indra-cli",
    "indra-bench",
    "indra-ffi",
    "indra-keystore",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["INDRA Protocol"]
license = "MIT"

[workspace.dependencies]
sha2               = { version = "0.10", default-features = false }
hmac               = { version = "0.12", default-features = false }
thiserror          = { version = "1.0" }
hex                = { version = "0.4", default-features = false, features = ["alloc"] }
bip39              = { version = "2.0", default-features = false, features = ["rand"] }
ed25519-dalek      = { version = "2.1", default-features = false, features = ["alloc"] }
curve25519-dalek   = { version = "4.1", default-features = false, features = ["alloc", "digest"] }
ml-dsa             = { version = "0.1.1", features = ["alloc", "getrandom"] }
ml-kem             = { version = "0.3.2", features = ["getrandom"] }
x25519-dalek       = { version = "2.0.1", features = ["getrandom", "static_secrets"] }
blake3             = { version = "1.8.5" }
proptest           = { version = "1.4", default-features = false, features = ["std"] }
indra-bulletproofs = { path = "./indra-bulletproofs" }
subtle             = { version = "2.5", default-features = false }
zeroize            = { version = "1.7", default-features = false, features = ["alloc", "derive"] }
rand_core          = { version = "0.6", default-features = false, features = ["getrandom"] }
rand               = { version = "0.8", default-features = false, features = ["std"] }
toml               = { version = "0.8", default-features = false, features = ["parse"] }
libc               = { version = "0.2" }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = { version = "1.0" }
argon2             = { version = "0.5" }
chacha20poly1305   = { version = "0.10.1" }
hickory-resolver   = { version = "0.26", default-features = false, features = ["tokio", "system-config", "dnssec-ring"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level = 0
debug     = true

[profile.bench]
opt-level = 3
debug     = false
